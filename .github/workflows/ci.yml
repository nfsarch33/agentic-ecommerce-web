name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Test, typecheck, lint, scan, build, and containerize
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Classify change scope
        id: change-scope
        run: |
          metadata_only=false
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch --no-tags --depth=1 origin "${{ github.base_ref }}"
            metadata_only=true
            # Two-dot diff: the checkout and the fetch above are both
            # depth=1, so the three-dot form cannot find a merge base and
            # died with "no merge base" — the read loop then saw NO files,
            # every PR was classified metadata-only, and hosted e2e/Docker/
            # Trivy silently stopped running on PRs (main pushes were the
            # only lane left, and they were red). Two-dot diffs the two
            # tips directly, which is exactly the PR's changes here.
            changed=$(git diff --name-only "origin/${{ github.base_ref }}..HEAD" || true)
            # Fail OPEN: an empty diff means the classifier is broken (a
            # real PR always changes something) — run the gates, never
            # skip them on a diff we could not compute.
            if [ -z "$changed" ]; then
              echo "::warning::change-scope diff came back empty; running all gates"
              metadata_only=false
            fi
            while IFS= read -r changed_file; do
              case "$changed_file" in
                .github/workflows/ci.yml|CHANGELOG.md|README.md|docs/release-checklist.md|package.json)
                  ;;
                *)
                  metadata_only=false
                  ;;
              esac
            done <<< "$changed"
          fi
          echo "metadata_only=$metadata_only" >> "$GITHUB_OUTPUT"

      - name: Run gitleaks secret scan
        run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1 detect --source=/repo --config=/repo/.gitleaks.toml --no-git --redact --verbose

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: "1.3.13"

      - name: Cache Bun downloads
        uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: |
          if [ -f bun.lock ] || [ -f bun.lockb ]; then
            bun install --frozen-lockfile
          else
            bun install
          fi

      - name: Run dependency audit
        # GHSA-vfj7-8cjw-p6xm (braces, stack-exhaustion DoS) has NO patched
        # release — 3.0.3 is latest and the advisory lists "patched: none" —
        # and it is reachable only through the dev toolchain
        # (eslint-config-next -> fast-glob -> micromatch -> braces), never
        # the shipped bundle. Ignore this one advisory until upstream ships
        # a fix, then delete the flag.
        run: bun audit --audit-level=high --ignore=GHSA-vfj7-8cjw-p6xm

      - name: Run unit tests
        run: bun run test

      - name: Run typecheck
        run: bun run typecheck

      - name: Run lint
        run: bun run lint

      - name: Build app
        run: bun run build

      - name: Record metadata-only hosted gate
        if: steps.change-scope.outputs.metadata_only == 'true'
        run: echo "Metadata-only pull request; hosted Playwright and Docker gates are covered by release-local evidence."

      - name: Install Chromium for Playwright
        if: steps.change-scope.outputs.metadata_only != 'true'
        run: bunx playwright install --with-deps chromium

      - name: Run end-to-end tests
        if: steps.change-scope.outputs.metadata_only != 'true'
        run: bun run test:e2e

      - name: Build Docker image
        if: steps.change-scope.outputs.metadata_only != 'true'
        run: docker build -t agentic-ecommerce-web:${{ github.sha }} .

      - name: Scan Docker image with Trivy
        if: steps.change-scope.outputs.metadata_only != 'true'
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: agentic-ecommerce-web:${{ github.sha }}
          format: table
          vuln-type: os,library
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          trivyignores: .trivyignore
          exit-code: "1"
