stages:
  - status
  - preflight
  - quality
  - playwright
  - advisory
  - cleanup
  - notify

variables:
  GIT_STRATEGY: fetch
  GIT_SUBMODULE_STRATEGY: none
  # Runner tags: these yaml defaults are generic. The real tags of the
  # self-hosted runners are project-level CI/CD variables of the same names,
  # which override these values.
  EC_CI_RUNNER_TAG: "shell"
  EC_CI_GPU_RUNNER_TAG: "gpu"

default:
  tags:
    - $EC_CI_RUNNER_TAG
  interruptible: true
  before_script:
    - mkdir -p .gitlab-artifacts

status_pending:
  stage: status
  script:
    - bash scripts/ci/github_status.sh pending "GitLab frontend pipeline started"
  allow_failure: true

preflight:
  stage: preflight
  resource_group: frontend-1
  script:
    - bash scripts/ci/preflight.sh
  artifacts:
    when: always
    paths:
      - .gitlab-artifacts/preflight/

quality:
  stage: quality
  resource_group: frontend-1
  script:
    - bun run typecheck
    - bun run lint
    - bun run test
    - bun run build
  artifacts:
    when: always
    paths:
      - .gitlab-artifacts/preflight/

playwright_stable:
  stage: playwright
  resource_group: frontend-1
  timeout: 30m
  script:
    - bash scripts/ci/playwright_stable.sh
  artifacts:
    when: always
    paths:
      - .gitlab-artifacts/playwright/
      - playwright-report/

uiauto_compare:
  stage: advisory
  tags:
    - $EC_CI_GPU_RUNNER_TAG
  resource_group: gpu-1
  script:
    - bash scripts/ci/uiauto_compare.sh
  rules:
    - if: '$CI_RUN_ADVISORY_GPU == "true"'
  allow_failure: true
  artifacts:
    when: always
    paths:
      - .gitlab-artifacts/uiauto/

cleanup:
  stage: cleanup
  resource_group: frontend-1
  script:
    - bash scripts/ci/cleanup.sh
  when: always
  artifacts:
    when: always
    paths:
      - .gitlab-artifacts/cleanup/

status_success:
  stage: notify
  script:
    - bash scripts/ci/github_status.sh success "GitLab frontend pipeline passed"
  when: on_success
  allow_failure: true

status_failure:
  stage: notify
  script:
    - bash scripts/ci/github_status.sh failure "GitLab frontend pipeline failed"
  when: on_failure
  allow_failure: true
